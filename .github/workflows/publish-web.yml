name: Publish opensips.org Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'public/uploads/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-web
  cancel-in-progress: true

jobs:
  dispatch:
    name: Trigger website publication
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.OPENSIPS_WEB_APP }}
          private-key: ${{ secrets.OPENSIPS_WEB_KEY }}
          owner: OpenSIPS
          repositories: ${{ secrets.OPENSIPS_WEB_REPO }}
          permission-actions: write

      - name: Trigger private publish workflow
        uses: step-security/workflow-dispatch@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: ${{ secrets.OPENSIPS_WEB_REPO }}
          workflow: publish.yml
          ref: main
          inputs: '{"component": "docs"}'
